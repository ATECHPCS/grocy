<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>grocy_AI product form fixture</title>
	<style>
		:root { --primary: #007bff; --success: #28a745; }
		* { box-sizing: border-box; }
		body { margin: 0; padding: 16px; font-family: Roboto, sans-serif; color: #212529; }
		.row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
		.col, .col-12 { width: 100%; padding: 0 8px; }
		.card { border: 1px solid #dee2e6; border-radius: 4px; background: #fff; }
		.card-body { padding: 16px; }
		.card-title { margin: 0 0 8px; font-size: 24px; font-weight: 500; }
		.text-muted { color: #6c757d; }
		.input-group { display: flex; width: 100%; }
		.input-group-append { display: flex; }
		.form-control { min-width: 0; flex: 1 1 auto; min-height: 44px; padding: 8px; border: 1px solid #ced4da; }
		.btn { min-height: 44px; padding: 8px 12px; border: 1px solid transparent; border-radius: 4px; background: #f8f9fa; }
		.btn:disabled { opacity: .65; }
		.btn-outline-primary { color: #007bff; border-color: #007bff; }
		.btn-success { color: #fff; background: #28a745; }
		.btn-info { color: #fff; background: #17a2b8; }
		.invalid-feedback { color: #dc3545; }
		.d-none { display: none !important; }
		.mt-3 { margin-top: 16px; }
		.mb-0 { margin-bottom: 0; }
		.alert { padding: 12px; border: 1px solid transparent; border-radius: 4px; }
		.alert-warning { background: #fff3cd; color: #856404; }
		.alert-secondary { background: #e2e3e5; color: #383d41; }
		.alert-success { background: #d4edda; color: #155724; }
		.alert-danger { background: #f8d7da; color: #721c24; }
		.product-form-grid { display: grid; gap: 24px; }
		.form-group { margin-bottom: 16px; }
		.form-group label { display: block; margin-bottom: 4px; }
		.save-actions { display: flex; flex-wrap: wrap; gap: 8px; }
		@media (min-width: 992px) { .product-form-grid { grid-template-columns: 1fr 1fr; } }
	</style>
	<link rel="stylesheet" href="/assets/grocy-ai.css">
</head>
<body>
	<main class="product-form-grid">
		<form id="product-form" novalidate>
			<div class="form-group">
				<label for="name">Name</label>
				<input class="form-control" id="name" name="name" value="Existing manual product">
			</div>
			<div class="save-actions">
				<button id="save-product-button" class="save-product-button btn btn-success" type="button" data-location="continue">Save &amp; continue</button>
				<button class="save-product-button btn btn-info" type="button" data-location="return">Save &amp; return to products</button>
			</div>
		</form>

		<section>
			<div class="row permission-MASTER_DATA_EDIT" id="grocy-ai-product-enrichment">
				<div class="col">
					<div class="card grocy-ai-card">
						<div class="card-body">
							<h4 class="card-title">grocy_AI product enrichment</h4>
							<p class="text-muted">Search product metadata and real package images by UPC. Results are previews and are not saved automatically.</p>
							<div class="input-group">
								<input class="form-control" id="grocy-ai-upc" type="text" inputmode="numeric" autocomplete="off" placeholder="UPC / EAN / GTIN">
								<div class="input-group-append">
									<button class="btn btn-outline-primary" id="grocy-ai-search-button" type="button">Search</button>
								</div>
							</div>
							<div class="invalid-feedback d-block d-none" id="grocy-ai-error"></div>
							<div class="mt-3 d-none" id="grocy-ai-results" aria-live="polite"></div>
						</div>
					</div>
				</div>
			</div>

			<div class="form-group mt-3">
				<label for="product-picture">Picture</label>
				<input id="product-picture" type="file" accept="image/*">
				<span id="product-picture-label"></span>
			</div>
		</section>
	</main>

	<script>
	(function ()
	{
		'use strict';

		window.__fixtureAdapterVersion = 'jquery-compatible-fixture-1.0.0';
		window.__fixtureCounters = {
			apiCalls: [],
			enrichment: 0,
			product: 0,
			barcode: 0,
			stock: 0,
			file: 0,
			save: 0,
			saveClicks: 0,
			objectUrlsCreated: 0,
			objectUrlsRevoked: 0
		};

		function JQueryCompatible(target)
		{
			if (!(this instanceof JQueryCompatible))
			{
				return new JQueryCompatible(target);
			}

			if (typeof target === 'string')
			{
				this.elements = Array.from(document.querySelectorAll(target));
			}
			else if (target === window || target === document || target instanceof Element)
			{
				this.elements = [target];
			}
			else
			{
				this.elements = [];
			}
		}

		JQueryCompatible.prototype.on = function (eventName, handler)
		{
			this.elements.forEach(function (element)
			{
				element.addEventListener(eventName, function (event)
				{
					var args = Array.isArray(event.detail) ? event.detail : [];
					handler.apply(element, [event].concat(args));
				});
			});
			return this;
		};

		JQueryCompatible.prototype.trigger = function (eventName, args)
		{
			this.elements.forEach(function (element)
			{
				element.dispatchEvent(new CustomEvent(eventName, { bubbles: true, detail: args || [] }));
			});
			return this;
		};

		JQueryCompatible.prototype.collapse = function (action)
		{
			this.elements.forEach(function (element)
			{
				var show = action === 'show' || (action === 'toggle' && !element.classList.contains('show'));
				element.classList.toggle('show', show);
				element.classList.toggle('d-none', !show);
			});
			return this;
		};

		JQueryCompatible.prototype.modal = JQueryCompatible.prototype.collapse;
		JQueryCompatible.prototype.jquery = window.__fixtureAdapterVersion;
		window.$ = window.jQuery = JQueryCompatible;
		window.$.fn = JQueryCompatible.prototype;

		window.U = function (path)
		{
			return path;
		};
		window.GetUriParam = function (key)
		{
			var value = new URL(window.location.href).searchParams.get(key);
			return value === null ? undefined : value;
		};

		function classifyApiCall(method, url)
		{
			var counters = window.__fixtureCounters;
			counters.apiCalls.push({ method: method, url: url });
			if (url.indexOf('/api/grocy-ai/products/enrich/upc/') === 0)
			{
				counters.enrichment++;
				return;
			}
			if (/\/api\/(objects\/products|products)/.test(url)) counters.product++;
			if (/\/api\/.*barcode/.test(url)) counters.barcode++;
			if (/\/api\/stock/.test(url)) counters.stock++;
			if (/\/api\/(files|.*upload)/.test(url)) counters.file++;
			if (method !== 'GET') counters.save++;
		}

		window.Grocy = {
			Api: {},
			FrontendHelpers: {
				ValidateForm: function () { return true; },
				BeginUiBusy: function () {},
				EndUiBusy: function () {},
				ShowGenericError: function () {}
			},
			Components: {
				CameraBarcodeScanner: { CurrentTarget: 'grocy-ai-upc' }
			}
		};

		window.Grocy.BarcodeScanned = function (barcode, target)
		{
			window.$(document).trigger('Grocy.BarcodeScanned', [barcode, target]);
		};

		window.Grocy.Api.Get = function (apiFunction, success, error)
		{
			var url = window.U('/api/' + apiFunction);
			classifyApiCall('GET', url);
			var xhr = new XMLHttpRequest();
			xhr.onreadystatechange = function ()
			{
				if (xhr.readyState !== XMLHttpRequest.DONE) return;
				if (xhr.status === 200 || xhr.status === 204)
				{
					if (success) success(xhr.status === 200 ? JSON.parse(xhr.responseText) : {});
				}
				else if (error)
				{
					error(xhr);
				}
			};
			xhr.open('GET', url, true);
			xhr.send();
			return xhr;
		};

		['Post', 'Put', 'Delete', 'UploadFile', 'DeleteFile'].forEach(function (methodName)
		{
			window.Grocy.Api[methodName] = function (apiFunction)
			{
				classifyApiCall(methodName.toUpperCase(), '/api/' + apiFunction);
				throw new Error('Persistence is intentionally unavailable in the browser fixture');
			};
		});

		if (!navigator.clipboard)
		{
			Object.defineProperty(navigator, 'clipboard', {
				value: { writeText: async function () {} }
			});
		}

		window.URL.createObjectURL = function ()
		{
			window.__fixtureCounters.objectUrlsCreated++;
			return 'blob:grocy-ai-fixture-' + window.__fixtureCounters.objectUrlsCreated;
		};
		window.URL.revokeObjectURL = function ()
		{
			window.__fixtureCounters.objectUrlsRevoked++;
		};

		document.querySelectorAll('.save-product-button').forEach(function (button)
		{
			button.addEventListener('click', function ()
			{
				window.__fixtureCounters.saveClicks++;
			});
		});
	})();
	</script>
	<script src="/assets/product-enrichment.js"></script>
</body>
</html>
