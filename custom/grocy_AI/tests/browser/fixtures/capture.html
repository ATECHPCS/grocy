<!doctype html>
<html lang="en" data-core-version="4.6.0" data-grocy-ai-module-version="2.5.0">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>grocy_AI purchase capture fixture</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 16px; font-family: Roboto, sans-serif; color: #212529; }
		.row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
		.col { width: 100%; padding: 0 8px; }
		.form-control { display: block; width: 100%; min-width: 0; padding: 8px; border: 1px solid #ced4da; }
		.form-control-lg { min-height: 44px; padding: 12px; }
		.btn { min-height: 44px; padding: 8px 12px; border: 1px solid transparent; border-radius: 4px; background: #f8f9fa; }
		.btn-lg { min-height: 48px; }
		.btn-primary { color: #fff; background: #007bff; }
		.btn-outline-secondary { color: #6c757d; border-color: #6c757d; }
		.list-group { display: block; padding: 0; margin: 0; list-style: none; }
		.list-group-item { display: block; padding: 12px; border: 1px solid #dee2e6; }
		.d-flex { display: flex; }
		.justify-content-between { justify-content: space-between; }
		.align-items-center { align-items: center; }
		.text-muted { color: #6c757d; }
		.badge { padding: 4px 8px; border-radius: 8px; background: #e2e3e5; }
		.alert { padding: 12px; border: 1px solid transparent; border-radius: 4px; }
		.alert-secondary { background: #e2e3e5; color: #383d41; }
		.mt-3 { margin-top: 16px; }
		.mb-0 { margin-bottom: 0; }
		.mb-2 { margin-bottom: 8px; }
		.status-unknown, .status-conflict { color: #856404; }
	</style>
	<link rel="stylesheet" href="/assets/grocy-ai.css?v=2.5.0">
</head>
<body>
	<main>
		<!-- Mirrors views/grocyai_capture.blade.php: the STOCK_PURCHASE-gated scan loop. -->

		<div class="row permission-STOCK_PURCHASE"
			id="grocyai-capture"
			data-trips-endpoint="/api/grocy-ai/capture/trips"
			data-products-endpoint="/api/objects/products"
			data-label-known="Known"
			data-label-unknown="Unknown — needs product"
			data-label-product-fallback="Product #%s"
			data-label-trip-started="Trip started. Scan or enter a GTIN to add items."
			data-label-trip-error="Could not start a capture trip. Reload the page to try again."
			data-label-scan-error="That scan could not be added. Try again."
			data-label-empty="No items yet. Scan or enter a GTIN above."
			data-label-quantity="Quantity">
			<div class="col">
				<section class="grocy-ai-capture-scan-section" aria-labelledby="grocyai-capture-scan-heading">
					<h3 id="grocyai-capture-scan-heading">Scan</h3>
					<div class="form-group mb-2">
						<label for="grocyai-capture-barcode">GTIN</label>
						<input type="text"
							class="form-control form-control-lg barcodescanner-input"
							id="grocyai-capture-barcode"
							inputmode="numeric"
							autocomplete="off"
							enterkeyhint="done"
							placeholder="8, 12, 13, or 14 digits"
							data-target="grocyai-capture-barcode">
					</div>
					<div class="grocy-ai-actions">
						<button type="button" class="btn btn-primary btn-lg" id="grocyai-capture-add-button">Add</button>
						<button type="button" class="btn btn-outline-secondary btn-lg" id="grocyai-capture-new-trip-button">Start new trip</button>
					</div>
					<div class="grocy-ai-capture-status alert alert-secondary mt-3 mb-0"
						id="grocyai-capture-status"
						role="status"
						aria-live="polite"
						aria-atomic="true"></div>
				</section>

				<section class="grocy-ai-capture-lines-section mt-3" aria-labelledby="grocyai-capture-lines-heading">
					<h3 id="grocyai-capture-lines-heading">Captured items</h3>
					<ul class="list-group grocy-ai-capture-lines"
						id="grocyai-capture-lines"
						aria-live="polite"
						aria-labelledby="grocyai-capture-lines-heading"></ul>
				</section>
			</div>
		</div>
	</main>

	<script src="/fixtures/capture-harness.js"></script>
	<script src="/assets/capture.js?v=2.5.0"></script>
</body>
</html>
