<!doctype html>
<html lang="en" data-core-version="4.6.0" data-grocy-ai-module-version="2.5.0">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>grocy_AI purchase capture review fixture</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 16px; font-family: Roboto, sans-serif; color: #212529; }
		.row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
		.col-12 { width: 100%; padding: 0 8px; }
		.form-control { display: block; width: 100%; min-width: 0; padding: 8px; border: 1px solid #ced4da; }
		.btn { min-height: 44px; padding: 8px 12px; border: 1px solid transparent; border-radius: 4px; background: #f8f9fa; }
		.btn-sm { min-height: 32px; padding: 4px 8px; }
		.btn-success { color: #fff; background: #28a745; }
		.btn-outline-primary { color: #007bff; border-color: #007bff; }
		.btn-outline-secondary { color: #6c757d; border-color: #6c757d; }
		.btn-outline-danger { color: #dc3545; border-color: #dc3545; }
		.list-group { display: block; padding: 0; margin: 0; list-style: none; }
		.list-group-item { display: block; padding: 12px; border: 1px solid #dee2e6; }
		.list-group-item-action { width: 100%; text-align: left; background: #fff; }
		.list-group-item.active { background: #007bff; color: #fff; }
		.d-flex { display: flex; }
		.flex-wrap { flex-wrap: wrap; }
		.justify-content-between { justify-content: space-between; }
		.align-items-center { align-items: center; }
		.align-items-end { align-items: flex-end; }
		.align-self-center { align-self: center; }
		.text-muted { color: #6c757d; }
		.badge { padding: 4px 8px; border-radius: 8px; background: #e2e3e5; }
		.badge-secondary { background: #6c757d; color: #fff; }
		.input-group { display: flex; }
		.form-check { display: flex; align-items: center; }
		.alert { padding: 12px; border: 1px solid transparent; border-radius: 4px; }
		.alert-success { background: #d4edda; color: #155724; }
		.invalid-feedback { color: #dc3545; }
		.d-block { display: block; }
		.ml-2 { margin-left: 8px; }
		.ml-3 { margin-left: 16px; }
		.mr-2 { margin-right: 8px; }
		.mr-3 { margin-right: 16px; }
		.mt-2 { margin-top: 8px; }
		.mt-3 { margin-top: 16px; }
		.mb-0 { margin-bottom: 0; }
		.mb-2 { margin-bottom: 8px; }
		.small { font-size: 80%; }
		.status-unknown, .status-conflict { color: #856404; }
	</style>
	<link rel="stylesheet" href="/assets/grocy-ai.css?v=2.5.0">
</head>
<body>
	<main>
		<!-- Mirrors views/grocyai_capture_review.blade.php: the STOCK_PURCHASE-gated review + commit surface. -->
		<div class="row permission-STOCK_PURCHASE"
			id="grocyai-capture-review"
			data-trips-endpoint="/api/grocy-ai/capture/trips"
			data-product-new-url="/product/new"
			data-trip-id=""
			data-label-known="Known"
			data-label-unknown="Unknown — needs product"
			data-label-product-fallback="Product #%s"
			data-label-create-product="Create product"
			data-label-no-trips="No trips yet. Capture one first."
			data-label-no-trip-selected="Select a trip to review its items."
			data-label-empty-lines="This trip has no items."
			data-label-load-error="Could not load the trip. Try again."
			data-label-save-error="That change could not be saved. Try again."
			data-label-delete="Delete"
			data-label-selected="Include in purchase"
			data-label-quantity="Quantity"
			data-label-price="Price (optional)"
			data-label-location="Default location"
			data-label-store="Default store"
			data-label-none="(none)"
			data-label-mark-reviewing="Mark as reviewing"
			data-label-status="Status"
			data-label-commit="Commit purchase"
			data-label-committed="Committed — transaction %s"
			data-label-commit-partial="Committed %s item(s); unresolved items remain in the trip."
			data-label-commit-mismatch="The trip changed since it was loaded. Reload and commit again."
			data-label-commit-confirm="Commit the selected known items to stock as one purchase?">
			<div class="col-12 col-md-4">
				<h3>Trips</h3>
				<div class="list-group grocy-ai-capture-review-trips"
					id="grocyai-capture-review-trips"
					role="list"
					aria-label="Trips"></div>
			</div>
			<div class="col-12 col-md-8">
				<div class="grocy-ai-capture-review-detail"
					id="grocyai-capture-review-detail"
					aria-live="polite"></div>
			</div>
		</div>
	</main>

	<script src="/fixtures/capture-harness.js"></script>
	<script src="/assets/capture-review.js?v=2.5.0"></script>
</body>
</html>
